name: Build (fork, NetHelper)

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
    branches:
      - Meta
    tags:
      - "v*"
  pull_request:
    branches:
      - Meta
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  REGISTRY: docker.io
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jobs:
          # Only the targets we need: Windows amd64 (v2 = modern CPU baseline)
          - { goos: windows, goarch: amd64, goamd64: v2, output: amd64-v2 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set VERSION
        id: set_version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION="pr-${{ github.event.number }}"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV

      - name: Build core
        env:
          GOOS: ${{matrix.jobs.goos}}
          GOARCH: ${{matrix.jobs.goarch}}
          GOAMD64: ${{matrix.jobs.goamd64}}
        run: |
          go env
          go build -v -tags "with_gvisor" -trimpath -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${{ steps.set_version.outputs.VERSION }}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid="

      - name: Package Windows zip
        run: |
          cp mihomo.exe nethelper-${{matrix.jobs.goos}}-${{matrix.jobs.output}}.exe
          zip -r nethelper-${{matrix.jobs.goos}}-${{matrix.jobs.output}}-${{ steps.set_version.outputs.VERSION }}.zip nethelper-${{matrix.jobs.goos}}-${{matrix.jobs.output}}.exe
          echo "${{ steps.set_version.outputs.VERSION }}" > version.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "windows-${{matrix.jobs.output}}"
          path: |
            nethelper*.zip
            version.txt
          if-no-files-found: error

  Upload-Prerelease:
    permissions: write-all
    if: ${{ github.event_name != 'workflow_dispatch' && github.ref_type == 'branch' && !startsWith(github.event_name, 'pull_request') }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true

      - name: Set Env
        run: |
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV

      - name: Delete current release assets
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: Prerelease-${{ github.ref_name }}
          deleteOnlyFromDrafts: false

      - name: Upload Prerelease
        uses: softprops/action-gh-release@v2
        if: ${{  success() }}
        with:
          tag_name: Prerelease-${{ github.ref_name }}
          files: |
            bin/*.zip
            bin/version.txt
          prerelease: true
          generate_release_notes: true
          body: |
            Custom fork build (hfun2017/mihomo @ ${{ github.ref_name }})

            Binary renamed: mihomo -> nethelper
            Process name (metadata.Process): nethelper
